          $ref: "#/components/schemas/RelationshipMember"
        messageDate:
          type: string
          format: date
        content:
          type: string
        type:
          $ref: "#/components/schemas/MessageType"
        createdAt:
          type: string
          format: date-time

    CreateMessageRequest:
      type: object
      required: [content, type]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 500
        type:
          $ref: "#/components/schemas/MessageType"
        messageDate:
          type: string
          format: date

    MessagesEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          properties:
            data:
