        note:
          type: string
          maxLength: 100
          nullable: true
        entryDate:
          type: string
          format: date

    GoalEntriesEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          properties:
            data:
              type: object
              required: [items, nextCursor]
              properties:
                items:
                  type: array
                  items:
                    $ref: "#/components/schemas/GoalEntry"
                nextCursor:
                  type: string
                  nullable: true

    CreateGoalEntryEnvelope:
      allOf:
