          format: uuid
        goalId:
          type: string
          format: uuid
        relationshipId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        amountDelta:
          type: integer
          format: int64
          example: 2000
        note:
          type: string
          nullable: true
        entryDate:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time

    CreateGoalEntryRequest:
      type: object
