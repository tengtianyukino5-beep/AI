      type: string
      enum: [active, completed, archived]

    Goal:
      type: object
      required: [id, relationshipId, title, targetAmount, currentAmount, currency, status, coverType, progress, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        relationshipId:
          type: string
          format: uuid
        title:
          type: string
          example: 一緒に10万円貯める
        targetAmount:
          type: integer
          format: int64
          example: 100000
        currentAmount:
          type: integer
          format: int64
          example: 70000
        currency:
          type: string
          example: JPY
        status:
          $ref: "#/components/schemas/GoalStatus"
        coverType:
          type: string
          example: couple
        progress:
          type: number
          format: float
          example: 0.7
        completedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    GoalSummary:
      type: object
      required: [id, title, currentAmount, targetAmount, currency, progress, status]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        currentAmount:
          type: integer
          format: int64
        targetAmount:
          type: integer
          format: int64
        currency:
          type: string
        progress:
          type: number
          format: float
        status:
          $ref: "#/components/schemas/GoalStatus"

    CreateGoalRequest:
      type: object
      required: [title, targetAmount, currency]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 60
        targetAmount:
          type: integer
          format: int64
          minimum: 1
        currency:
          type: string
          minLength: 3
          maxLength: 3
          example: JPY
        coverType:
          type: string
          default: couple

    UpdateGoalRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 60
        targetAmount:
          type: integer
          format: int64
          minimum: 1
        coverType:
          type: string

    CurrentGoalEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          properties:
            data:
              nullable: true
              $ref: "#/components/schemas/Goal"

    GoalEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/Goal"

