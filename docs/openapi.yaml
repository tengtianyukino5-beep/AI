          format: uuid
        relationshipId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        checkinDate:
          type: string
          format: date
        mood:
          $ref: "#/components/schemas/Mood"
        note:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CheckinSummary:
      type: object
      required: [userId, mood, note, checkedInAt]
      properties:
        userId:
          type: string
          format: uuid
        mood:
          $ref: "#/components/schemas/Mood"
        note:
          type: string
          nullable: true
        checkedInAt:
          type: string
          format: date-time

    TodayCheckinEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          properties:
            data:
              type: object
              required: [date, me, partner, bothCompleted, streakDays]
              properties:
                date:
                  type: string
                  format: date
                me:
                  nullable: true
                  $ref: "#/components/schemas/CheckinSummary"
                partner:
                  nullable: true
                  $ref: "#/components/schemas/CheckinSummary"
                bothCompleted:
                  type: boolean
                streakDays:
                  type: integer

    SubmitCheckinEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          properties:
            data:
              type: object
              required: [checkin, bothCompleted, streakDays]
              properties:
                checkin:
                  $ref: "#/components/schemas/Checkin"
                bothCompleted:
                  type: boolean
                streakDays:
                  type: integer

    DateCheckinEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          properties:
            data:
              type: object
              required: [date, me, partner]
              properties:
                date:
                  type: string
                  format: date
                me:
                  nullable: true
                  $ref: "#/components/schemas/CheckinSummary"
                partner:
                  nullable: true
                  $ref: "#/components/schemas/CheckinSummary"

    CheckinTimelineEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          properties:
            data:
              type: object
              required: [items, nextCursor]
              properties:
                items:
                  type: array
                  items:
                    $ref: "#/components/schemas/TimelineItem"
                nextCursor:
                  type: string
                  nullable: true

    TimelineItem:
      type: object
      required: [id, checkinDate, user, mood, note, createdAt]
      properties:
        id:
          type: string
          format: uuid
        checkinDate:
          type: string
          format: date
        user:
          $ref: "#/components/schemas/RelationshipMember"
        mood:
          $ref: "#/components/schemas/Mood"
        note:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    CalendarEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          properties:
            data:
              type: object
              required: [month, days]
              properties:
                month:
                  type: string
                  example: "2024-05"
                days:
                  type: array
                  items:
                    $ref: "#/components/schemas/CalendarDay"

    CalendarDay:
      type: object
      required: [date, status, me, partner]
      properties:
        date:
          type: string
          format: date
        status:
          type: string
          enum: [both, me_only, partner_only, none, future]
        me:
          $ref: "#/components/schemas/CalendarMemberState"
        partner:
          $ref: "#/components/schemas/CalendarMemberState"

    CalendarMemberState:
      type: object
      required: [checkedIn]
      properties:
        checkedIn:
          type: boolean
        mood:
          nullable: true
          $ref: "#/components/schemas/Mood"

